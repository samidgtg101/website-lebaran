<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="corpBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F5C42"/>
      <stop offset="100%" stop-color="#16372A"/>
    </linearGradient>
    <linearGradient id="silverSleeve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F2FBF6"/>
      <stop offset="100%" stop-color="#DFF3E8"/>
    </linearGradient>
    <linearGradient id="goldCorp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5B5"/>
      <stop offset="100%" stop-color="#C9A23F"/>
    </linearGradient>
    <filter id="corpShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#16372A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="#F2FBF6"/>
  <!-- Minimal geometric background -->
  <line x1="30" y1="20" x2="370" y2="20" stroke="#C3E6D2" stroke-width="1"/>
  <line x1="30" y1="280" x2="370" y2="280" stroke="#C3E6D2" stroke-width="1"/>

  <!-- Corporate Box Set -->
  <g filter="url(#corpShadow)" transform="translate(60, 45)">
    <!-- Main Box -->
    <rect x="15" y="70" width="250" height="150" rx="14" fill="url(#corpBox)"/>
    <rect x="10" y="62" width="260" height="15" rx="6" fill="#2E7D5B"/>

    <!-- Custom Corporate Sleeve Band across center -->
    <rect x="80" y="62" width="120" height="158" fill="url(#silverSleeve)" rx="4"/>
    <rect x="85" y="70" width="110" height="142" fill="none" stroke="#A8D5BA" stroke-width="1" rx="4"/>

    <!-- Corporate Logo Custom Mockup inside sleeve -->
    <g transform="translate(140, 115)">
      <!-- Custom Hexagon Logo Emblem -->
      <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="#2E7D5B"/>
      <circle cx="0" cy="0" r="6" fill="url(#goldCorp)"/>
      <text x="0" y="32" font-family="'Plus Malang Sans', sans-serif" font-size="9" font-weight="700" fill="#16372A" text-anchor="middle" letter-spacing="1">YOUR LOGO HERE</text>
      <text x="0" y="44" font-family="'Plus Malang Sans', sans-serif" font-size="6.5" font-weight="600" fill="#4F6B5E" text-anchor="middle">CUSTOM SLEEVE / HOTPRINT</text>
    </g>

    <!-- Executive Items Peeking Out -->
    <!-- 1. Matte Black & Gold LED Tumbler -->
    <g transform="translate(28, 10)">
      <rect x="0" y="10" width="45" height="95" rx="8" fill="#16372A" stroke="#2E7D5B" stroke-width="1.5"/>
      <rect x="0" y="6" width="45" height="10" rx="4" fill="url(#goldCorp)"/>
      <circle cx="22" cy="11" r="2.5" fill="#16372A"/>
      <!-- Custom Engraved Icon on tumbler -->
      <path d="M22 45 l2 4 5 1 -4 3 1 5 -4 -2 -4 2 1 -5 -4 -3 5 -1 z" fill="url(#goldCorp)"/>
      <text x="22" y="70" font-family="'Plus Malang Sans', sans-serif" font-size="6.5" font-weight="600" fill="#C3E6D2" text-anchor="middle">LOGO</text>
    </g>

    <!-- 2. Premium Ajwa & Medjool Dates Box -->
    <g transform="translate(205, 10)">
      <rect x="0" y="10" width="55" height="90" rx="8" fill="#FFF9EC" stroke="#C9A23F" stroke-width="1.5"/>
      <rect x="5" y="15" width="45" height="80" rx="4" fill="#2E7D5B"/>
      <text x="27" y="48" font-family="'Fraunces', serif" font-size="8" font-weight="700" fill="url(#goldCorp)" text-anchor="middle">MEDJOOL</text>
      <text x="27" y="58" font-family="'Plus Malang Sans', sans-serif" font-size="6.5" font-weight="600" fill="#DFF3E8" text-anchor="middle">VIP DATES</text>
    </g>
  </g>
</svg>
