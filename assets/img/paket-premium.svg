<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="premBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16372A"/>
      <stop offset="100%" stop-color="#1F5C42"/>
    </linearGradient>
    <linearGradient id="premGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB3"/>
      <stop offset="50%" stop-color="#E5BE65"/>
      <stop offset="100%" stop-color="#C9A23F"/>
    </linearGradient>
    <filter id="premGlow">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#16372A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="#FFF9EC"/>
  <!-- Gold Islamic geometric stars pattern in background -->
  <g opacity="0.12" stroke="#C9A23F" stroke-width="1.2">
    <circle cx="330" cy="70" r="45"/>
    <polygon points="330,35 338,62 365,70 338,78 330,105 322,78 295,70 322,62"/>
  </g>

  <!-- Luxury Rigid Hardbox Arrangement -->
  <g filter="url(#premGlow)" transform="translate(50, 40)">
    <!-- Main Box -->
    <rect x="20" y="85" width="260" height="135" rx="16" fill="url(#premBox)"/>
    <!-- Gold Trim Border -->
    <rect x="24" y="89" width="252" height="127" rx="12" stroke="url(#premGold)" stroke-width="1.5" fill="none"/>
    <rect x="16" y="78" width="268" height="14" rx="6" fill="#1F5C42"/>

    <!-- Premium Items Arranged Inside -->
    <!-- 1. Turkish Luxury Sajadah -->
    <g transform="translate(38, 20)">
      <rect x="0" y="0" width="60" height="85" rx="6" fill="#2E7D5B"/>
      <rect x="6" y="6" width="48" height="73" rx="4" stroke="url(#premGold)" stroke-width="1" fill="none"/>
      <!-- Mihrab Arch Motif -->
      <path d="M14 35 Q30 14 46 35 L46 70 L14 70 Z" fill="#16372A"/>
      <circle cx="30" cy="45" r="4" fill="url(#premGold)"/>
    </g>

    <!-- 2. Nastar Royal Toples Kaca Kristal -->
    <g transform="translate(108, 12)">
      <rect x="0" y="10" width="65" height="75" rx="10" fill="#FFF8E7" stroke="#FFF" stroke-width="2"/>
      <rect x="-2" y="2" width="69" height="12" rx="4" fill="url(#premGold)"/>
      <circle cx="20" cy="35" r="8" fill="#E6A838"/>
      <circle cx="45" cy="35" r="8" fill="#E6A838"/>
      <circle cx="32" cy="55" r="8" fill="#E6A838"/>
      <rect x="8" y="62" width="49" height="15" rx="3" fill="#FFF9EC"/>
      <text x="32" y="73" font-family="'Fraunces', serif" font-size="7" font-weight="700" fill="#16372A" text-anchor="middle">ROYAL NASTAR</text>
    </g>

    <!-- 3. Kastengel Wisman Toples -->
    <g transform="translate(182, 12)">
      <rect x="0" y="10" width="65" height="75" rx="10" fill="#FFF8E7" stroke="#FFF" stroke-width="2"/>
      <rect x="-2" y="2" width="69" height="12" rx="4" fill="url(#premGold)"/>
      <rect x="14" y="25" width="16" height="9" rx="2" fill="#E5AC4E"/>
      <rect x="35" y="25" width="16" height="9" rx="2" fill="#E5AC4E"/>
      <rect x="24" y="40" width="18" height="9" rx="2" fill="#E5AC4E"/>
      <rect x="8" y="62" width="49" height="15" rx="3" fill="#FFF9EC"/>
      <text x="32" y="73" font-family="'Fraunces', serif" font-size="7" font-weight="700" fill="#16372A" text-anchor="middle">KASTENGEL</text>
    </g>

    <!-- Reed Diffuser Aroma Kasturi Nabawi -->
    <g transform="translate(245, 30)">
      <rect x="5" y="25" width="30" height="42" rx="8" fill="#FFF" stroke="#C9A23F" stroke-width="1.5"/>
      <line x1="20" y1="2" x2="10" y2="25" stroke="#C9A23F" stroke-width="2"/>
      <line x1="20" y1="0" x2="20" y2="25" stroke="#C9A23F" stroke-width="2"/>
      <line x1="20" y1="4" x2="28" y2="25" stroke="#C9A23F" stroke-width="2"/>
    </g>

    <!-- Crystal Tasbih & Gold Foil Calligraphy -->
    <g transform="translate(150, 140)">
      <!-- Arabic Calligraphy in Gold -->
      <text x="0" y="5" font-family="'Amiri', serif" font-size="24" fill="url(#premGold)" text-anchor="middle">عيد مبارك</text>
      <text x="0" y="28" font-family="'Fraunces', serif" font-size="12" font-weight="700" fill="#FFFDF8" text-anchor="middle" letter-spacing="2">PAKET PREMIUM VIP</text>
      <text x="0" y="44" font-family="'Plus Malang Sans', sans-serif" font-size="8.5" font-weight="500" fill="#F3E5B5" text-anchor="middle">Kemasan Rigid Hardbox Eksklusif</text>
    </g>
  </g>
</svg>
