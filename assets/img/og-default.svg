<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F5C42"/>
      <stop offset="100%" stop-color="#16372A"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3CE"/>
      <stop offset="50%" stop-color="#E5BF64"/>
      <stop offset="100%" stop-color="#C9A23F"/>
    </linearGradient>
  </defs>

  <!-- Dark Emerald Background with subtle gold geometric pattern -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  
  <!-- Outer Gold Border -->
  <rect x="24" y="24" width="1152" height="582" rx="20" stroke="#C9A23F" stroke-width="2" fill="none" opacity="0.6"/>
  <rect x="36" y="36" width="1128" height="558" rx="14" stroke="#2E7D5B" stroke-width="1.5" fill="none"/>

  <!-- Big Decorative Crescent Moon Right -->
  <g transform="translate(850, 80)">
    <path d="M180 40 A160 160 0 1 0 180 360 A120 120 0 0 1 180 40 Z" fill="#C9A23F" opacity="0.2"/>
    <g transform="translate(10, 80)">
      <polygon points="24,0 30,18 48,24 30,30 24,48 18,30 0,24 18,18" fill="#F3E5B5"/>
    </g>
  </g>

  <!-- Left Content -->
  <g transform="translate(100, 130)">
    <!-- Brand Badge -->
    <rect x="0" y="0" width="310" height="42" rx="21" fill="#2E7D5B"/>
    <text x="155" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFF9EC" text-anchor="middle" letter-spacing="1">PRE-ORDER LEBARAN 2027</text>

    <!-- Main Title -->
    <text x="0" y="115" font-family="'Fraunces', serif" font-size="54" font-weight="700" fill="#FFFFFF">Souvenir &amp; Hampers</text>
    <text x="0" y="180" font-family="'Fraunces', serif" font-size="54" font-weight="700" fill="url(#goldText)">Lebaran Eksklusif</text>
    
    <!-- Subtitle -->
    <text x="0" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="400" fill="#DFF3E8">Bisa Custom Logo Perusahaan • Kemasan Rapi • Kirim Seluruh Indonesia</text>

    <!-- Bullets -->
    <g transform="translate(0, 275)" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="600" fill="#FFF">
      <circle cx="10" cy="8" r="5" fill="#C9A23F"/>
      <text x="26" y="14">Paket Hemat, Reguler, Premium &amp; Corporate</text>

      <circle cx="10" cy="40" r="5" fill="#C9A23F"/>
      <text x="26" y="46">Konsultasi Desain &amp; Mockup Gratis</text>

      <circle cx="10" cy="72" r="5" fill="#C9A23F"/>
      <text x="26" y="78">Hubungi WhatsApp: 0822-1122-1909</text>
    </g>
  </g>
</svg>
