<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380" fill="none">
  <rect width="500" height="380" fill="#F2FBF6"/>
  <!-- Family Gathering & Trah Souvenir theme -->
  <g transform="translate(60, 45)">
    <rect x="40" y="80" width="260" height="170" rx="14" fill="#2E7D5B"/>
    <rect x="35" y="72" width="270" height="16" rx="6" fill="#1F5C42"/>
    <rect x="140" y="72" width="60" height="178" fill="#F3E5B5"/>
    <!-- Calligraphy text on box -->
    <text x="170" y="145" font-family="'Amiri', serif" font-size="28" fill="#FFF9EC" text-anchor="middle">سعادة</text>
    <text x="170" y="175" font-family="'Fraunces', serif" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">Trah Hadiningrat</text>
    <!-- Sajadah and cookies -->
    <rect x="70" y="25" width="65" height="70" rx="8" fill="#DFF3E8" stroke="#2E7D5B" stroke-width="1.5"/>
    <text x="102" y="65" font-family="'Plus Malang Sans', sans-serif" font-size="9" font-weight="700" fill="#16372A" text-anchor="middle">SAJADAH</text>
    <rect x="200" y="25" width="60" height="70" rx="8" fill="#FFF8E7" stroke="#C9A23F" stroke-width="1.5"/>
    <circle cx="230" cy="55" r="14" fill="#E6A838"/>
  </g>
  <rect x="0" y="320" width="500" height="60" fill="rgba(22, 55, 42, 0.9)"/>
  <text x="24" y="345" font-family="'Fraunces', serif" font-size="15" font-weight="700" fill="#FFF">Keluarga Besar Trah Hadiningrat (120 Pcs)</text>
  <text x="24" y="363" font-family="'Plus Malang Sans', sans-serif" font-size="12" fill="#DFF3E8">Paket Reguler Custom Greeting Card Keluarga</text>
</svg>
