<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" fill="none">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFF3E8"/>
      <stop offset="100%" stop-color="#FFF9EC"/>
    </linearGradient>
    <linearGradient id="hijabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#368D67"/>
      <stop offset="100%" stop-color="#246448"/>
    </linearGradient>
  </defs>

  <circle cx="150" cy="150" r="145" fill="url(#avatarBg)" stroke="#A8D5BA" stroke-width="4"/>
  <!-- Decorative Crescent Moon in background -->
  <path d="M220 50 A60 60 0 1 0 220 170 A48 48 0 0 1 220 50 Z" fill="#C9A23F" opacity="0.25"/>

  <!-- Founder Portrait Silhouette Illustration (Annisa Wardhana, S.Ds) -->
  <g transform="translate(45, 45)">
    <!-- Shoulders / Blouse -->
    <path d="M20 220 C20 175 60 160 105 160 C150 160 190 175 190 220 Z" fill="#FFFDF8" stroke="#C3E6D2" stroke-width="2"/>
    <path d="M85 160 L105 210 L125 160 Z" fill="#E8F6EF"/>
    <circle cx="105" cy="180" r="3" fill="#C9A23F"/>
    <circle cx="105" cy="195" r="3" fill="#C9A23F"/>

    <!-- Hijab drape -->
    <path d="M50 105 C50 60 75 40 105 40 C135 40 160 60 160 105 C160 145 155 180 135 195 C120 205 90 205 75 195 C55 180 50 145 50 105 Z" fill="url(#hijabGrad)"/>

    <!-- Face Oval -->
    <path d="M78 80 C78 60 88 52 105 52 C122 52 132 60 132 80 C132 108 122 125 105 125 C88 125 78 108 78 80 Z" fill="#FFDFC4"/>

    <!-- Inner Hijab / Ciput Band -->
    <path d="M82 66 Q105 58 128 66 Q105 60 82 66 Z" fill="#F3E5B5"/>

    <!-- Eyes (Gentle, friendly smile) -->
    <path d="M88 84 Q94 80 100 84" stroke="#16372A" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M110 84 Q116 80 122 84" stroke="#16372A" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- Eyebrows -->
    <path d="M86 78 Q94 74 100 78" stroke="#16372A" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M110 78 Q116 74 124 78" stroke="#16372A" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Nose tip -->
    <path d="M104 88 Q105 93 102 95" stroke="#E0A985" stroke-width="1.5" fill="none"/>
    <!-- Warm smile -->
    <path d="M96 104 Q105 112 114 104" stroke="#D15B5B" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Glasses (Creative Designer look) -->
    <rect x="84" y="78" width="18" height="14" rx="4" stroke="#C9A23F" stroke-width="1.5" fill="none"/>
    <rect x="108" y="78" width="18" height="14" rx="4" stroke="#C9A23F" stroke-width="1.5" fill="none"/>
    <line x1="102" y1="84" x2="108" y2="84" stroke="#C9A23F" stroke-width="1.5"/>
  </g>
</svg>
