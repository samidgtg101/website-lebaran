<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="regBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D5B"/>
      <stop offset="100%" stop-color="#1F5C42"/>
    </linearGradient>
    <linearGradient id="regRibbon" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#F3E5B5"/>
      <stop offset="50%" stop-color="#E2BF63"/>
      <stop offset="100%" stop-color="#C9A23F"/>
    </linearGradient>
    <filter id="shadowReg">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#16372A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="#F2FBF6"/>
  <!-- Star Background Accents -->
  <circle cx="60" cy="50" r="2.5" fill="#C9A23F"/>
  <circle cx="340" cy="40" r="3" fill="#C9A23F"/>
  <circle cx="360" cy="80" r="2" fill="#2E7D5B"/>

  <!-- Hampers Box -->
  <g filter="url(#shadowReg)" transform="translate(60, 45)">
    <!-- Main Box -->
    <rect x="20" y="80" width="240" height="135" rx="14" fill="url(#regBox)"/>
    <!-- Lid edge -->
    <rect x="16" y="74" width="248" height="14" rx="6" fill="#368D67"/>
    <!-- Gold Ribbon Cross -->
    <rect x="120" y="74" width="24" height="141" fill="url(#regRibbon)"/>

    <!-- Two Glass Cookie Jars -->
    <g transform="translate(45, 10)">
      <!-- Jar 1 -->
      <rect x="0" y="10" width="70" height="75" rx="10" fill="#FFFDF8" stroke="#DFF3E8" stroke-width="2"/>
      <rect x="-2" y="2" width="74" height="12" rx="4" fill="url(#regRibbon)"/>
      <circle cx="22" cy="35" r="8" fill="#E6A838"/>
      <circle cx="48" cy="35" r="8" fill="#E6A838"/>
      <circle cx="35" cy="55" r="8" fill="#E6A838"/>
      <rect x="10" y="60" width="50" height="16" rx="3" fill="#F2FBF6"/>
      <text x="35" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#16372A" text-anchor="middle">NASTAR</text>
    </g>

    <g transform="translate(130, 10)">
      <!-- Jar 2 -->
      <rect x="0" y="10" width="70" height="75" rx="10" fill="#FFFDF8" stroke="#DFF3E8" stroke-width="2"/>
      <rect x="-2" y="2" width="74" height="12" rx="4" fill="url(#regRibbon)"/>
      <rect x="14" y="25" width="18" height="9" rx="2" fill="#E5AC4E"/>
      <rect x="38" y="25" width="18" height="9" rx="2" fill="#E5AC4E"/>
      <rect x="26" y="40" width="18" height="9" rx="2" fill="#E5AC4E"/>
      <rect x="10" y="60" width="50" height="16" rx="3" fill="#F2FBF6"/>
      <text x="35" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#16372A" text-anchor="middle">KASTENGEL</text>
    </g>

    <!-- Sajadah Pocket / Kurma Box -->
    <g transform="translate(205, 30)">
      <rect x="0" y="10" width="55" height="75" rx="8" fill="#DFF3E8" stroke="#2E7D5B" stroke-width="1.5"/>
      <text x="27" y="45" font-family="'Fraunces', serif" font-size="8" font-weight="700" fill="#16372A" text-anchor="middle">AJWA</text>
      <text x="27" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="600" fill="#4F6B5E" text-anchor="middle">DATES</text>
    </g>

    <!-- Greeting Card on Ribbon Bow -->
    <g transform="translate(108, 60)">
      <ellipse cx="14" cy="10" rx="14" ry="7" fill="url(#regRibbon)"/>
      <ellipse cx="34" cy="10" rx="14" ry="7" fill="url(#regRibbon)"/>
      <circle cx="24" cy="10" r="6" fill="#B38E32"/>
      
      <rect x="2" y="25" width="44" height="60" rx="4" fill="#FFFDF8" stroke="#C9A23F" stroke-width="1" transform="rotate(-6 24 50)"/>
      <text x="22" y="52" font-family="'Fraunces', serif" font-size="6.5" font-weight="700" fill="#16372A" text-anchor="middle">EID MUBARAK</text>
      <circle cx="22" cy="40" r="3" fill="#2E7D5B"/>
    </g>

    <!-- Brand Typography on Box -->
    <text x="140" y="165" font-family="'Fraunces', serif" font-size="12" font-weight="700" fill="#FFF9EC" text-anchor="middle" letter-spacing="1">PAKET REGULER</text>
    <text x="140" y="182" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="500" fill="#DFF3E8" text-anchor="middle">Pilihan Paling Favorit</text>
  </g>
</svg>
