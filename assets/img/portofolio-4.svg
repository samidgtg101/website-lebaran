<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380" fill="none">
  <rect width="500" height="380" fill="#E8F4ED"/>
  <!-- Pertamina BUMN Buka Bersama Souvenir -->
  <g transform="translate(60, 40)">
    <!-- Canvas Tote Goodie Bags in batch -->
    <rect x="30" y="70" width="120" height="150" rx="12" fill="#FFFFFF" stroke="#A8D5BA" stroke-width="2"/>
    <path d="M60 70 C60 40 120 40 120 70" stroke="#2E7D5B" stroke-width="6" fill="none"/>
    <circle cx="90" cy="120" r="20" fill="#E22428"/>
    <text x="90" y="125" font-family="'Plus Malang Sans', sans-serif" font-size="9" font-weight="700" fill="#FFF" text-anchor="middle">BUMN</text>
    
    <rect x="180" y="70" width="120" height="150" rx="12" fill="#FFFFFF" stroke="#A8D5BA" stroke-width="2"/>
    <path d="M210 70 C210 40 270 40 270 70" stroke="#2E7D5B" stroke-width="6" fill="none"/>
    <circle cx="240" cy="120" r="20" fill="#0072CE"/>
    <text x="240" y="125" font-family="'Plus Malang Sans', sans-serif" font-size="9" font-weight="700" fill="#FFF" text-anchor="middle">BERKAH</text>

    <!-- Tumbler & dates box -->
    <rect x="135" y="150" width="50" height="90" rx="8" fill="#16372A"/>
    <rect x="140" y="155" width="40" height="8" rx="2" fill="#C9A23F"/>
  </g>
  <rect x="0" y="320" width="500" height="60" fill="rgba(22, 55, 42, 0.9)"/>
  <text x="24" y="345" font-family="'Fraunces', serif" font-size="15" font-weight="700" fill="#FFF">PT Pertamina (Persero) (400 Pcs)</text>
  <text x="24" y="363" font-family="'Plus Malang Sans', sans-serif" font-size="12" fill="#DFF3E8">Souvenir Buka Bersama &amp; Santunan Ramadan BUMN</text>
